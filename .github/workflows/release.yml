name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with tests
        run: ./gradlew clean build --no-daemon

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: TerraCraftChat v${{ steps.version.outputs.VERSION }}
          body: |
            ## TerraCraftChat v${{ steps.version.outputs.VERSION }}

            ### Установка
            1. Скачай `TerraCraftChat-${{ steps.version.outputs.VERSION }}.jar` ниже
            2. Положи в `plugins/` (Paper 26.3+)
            3. Установи [CommandAPI 12.1.0+](https://github.com/CommandAPI/CommandAPI/releases)
            4. Установи [MineSQL](https://github.com/CarmJos/MineSQL) и добавь источник `terracraft-chat` в его конфиг
            5. Перезапусти сервер

            ### Требования
            - Paper 26.3+
            - Java 25+
            - CommandAPI 12.1.0+ (обязательно)
            - MineSQL (обязательно для истории/игноров/статистики)
            - PlaceholderAPI — опционально
            - SkinsRestorer — опционально (для корректных голов игроков, особенно в offline-mode)

            ### Права
            Полный список — в `paper-plugin.yml` (`permissions:`), префикс `terracraftchat.`
          files: build/libs/TerraCraftChat-*.jar
          draft: false
          prerelease: false
