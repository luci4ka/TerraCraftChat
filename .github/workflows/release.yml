name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: TerraCraftChat v${{ steps.version.outputs.VERSION }}
          body: |
            ## TerraCraftChat v${{ steps.version.outputs.VERSION }}

            ### Установка
            1. Скачай `Chat-1.0.jar` ниже
            2. Положи в `plugins/` Paper 1.21.11
            3. Установи [CommandAPI 12.1.0+](https://github.com/CommandAPI/CommandAPI/releases)
            4. Перезапусти сервер

            ### Требования
            - Paper 1.21.11+
            - Java 25+
            - CommandAPI 12.1.0+
          files: build/libs/Chat-*.jar
          draft: false
          prerelease: false
          generate_release_notes: true
