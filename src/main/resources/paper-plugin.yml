name: Chat
version: '${version}'
main: ru.terracraft.chat.TerraCraftChatPlugin
api-version: '26.1'
authors: [ luci ]
description: Плагин на чат
website: https://github.com/luci4ka/TerraCraftChat
folia-supported: false

dependencies:
  server:
    CommandAPI:
      load: BEFORE
      required: true
      join-classpath: true
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
    MineSQL:
      load: BEFORE
      required: true
      join-classpath: true