# ============================================================
#  CHAT — messages
# ============================================================

chat:
  # ===== Common =====
  prefix: "<gray>[<gold>TerraCraftChat<gray>] <reset>"
  no-permission: "<red>You don't have permission to do this."
  config-reloaded: "<green>Configuration reloaded."
  config-reload-failed: "<red>Failed to reload config. Check console."

  # ===== Channels =====
  channel-no-access: "<red>You don't have access to this channel."
  channel-unknown: "<red>Channel '<id>' not found."
  channel-switched: "<gray>Active channel: <yellow><channel></yellow>"
  channel-reset: "<gray>Channel reset to default."

  # ===== Nick =====
  nick-empty: "<red>Nickname cannot be empty."
  nick-too-long: "<red>Nickname too long (max 16)."
  nick-set: "<green>Nickname set."
  nick-reset: "<yellow>Nickname reset."
  nick-invalid: "<red>Nickname contains forbidden tags."
  nick-impersonation: "<red>Nickname matches player <white><player></white>."
  nick-reserved: "<red>Nickname '<player>' is reserved."

  # ===== Ignore =====
  ignore-enabled: "<gray>You no longer see messages from <white><player><gray>."
  ignore-disabled: "<gray>You now see messages from <white><player><gray> again."
  cannot-ignore-self: "<red>You cannot ignore yourself."
  ignore-list-empty: "<gray>Your ignore list is empty."
  ignore-list-header: "<gray>Ignored (<count>):"
  ignore-list-entry: "<dark_gray> • <white><player>"

  # ===== /msg, /reply =====
  cannot-message-self: "<red>You cannot message yourself."
  target-ignoring-you: "<red>This player is ignoring your messages."
  you-ignoring-target: "<red>You are ignoring this player. Use /ignore <player> to stop."
  no-reply-target: "<red>You have no one to reply to."

  # ===== Social spy =====
  socialspy-enabled: "<green>Social spy enabled. You now see all private messages."
  socialspy-disabled: "<red>Social spy disabled."

  # ===== Moderation =====
  cooldown: "<red>Wait <white><seconds> <red>sec. before your next message."
  duplicate: "<red>Don't spam the same message!"
  similar: "<red>Don't spam similar messages!"
  flood: "<red>Too many repeating characters!"
  crash: "<red>Message contains invalid characters."
  swear: "<red>Please don't use profanity."
  anti-ad: "<red>Advertising is not allowed!"

  # ===== Threads =====
  thread-active: "<green>Reply mode enabled. Your next message will go to the thread."
  thread-limit: "<red>Thread reply limit reached."
  thread-no-access: "<red>You did not see this message and cannot reply."
  thread-disabled: "<red>Threads are disabled."
  thread-self-reply: "<red>You cannot reply to your own message in a thread."
  thread-button-hover: "<gray>Reply in thread"
  thread-more: "<dark_gray>... <count> more replies"
  thread-replied: "<dark_gray>replied to <target>"

  # ===== Delete =====
  delete-button-hover: "<red>Delete this message"
  delete-notice: "<red>--- Message from <sender> deleted by <moderator> ---"
  delete-disabled: "<red>Message deletion is disabled."
  invalid-id: "<red>Invalid message ID."
  message-not-found: "<red>Message not found or expired."

  # ===== [inv] and [item] =====
  inv-self-not-allowed: "<red>You can't view your own inventory through [inv]."
  inv-token-invalid: "<red>Inventory link expired or invalid."
  item-hand-empty: "<gray>empty"
  inv-label: "<aqua>[Inventory]</aqua>"
  inv-hover: "<gray>Click to view <white><player></white>'s inventory"

  # ===== Discord =====
  discord-format: "**[Broadcast]** <sender>: <message>"

# ============================================================
#  AUTOBROADCAST
# ============================================================

autobroadcast:
  rules: "<yellow>Don't forget to read the rules: <white>/rules"
  discord: "<yellow>Our Discord: <white>discord.gg/terracraft"
  donate: "<yellow>Buy donates: <white>/donate"

# ============================================================
#  CHAT GAMES
# ============================================================

chatgames:
  unscramble:
    start: "<gold>[Game] <yellow>Unscramble the word: <white><prompt>"
    win: "<green>[Game] <yellow><player> <green>guessed the word <white><answer> <green>in <time> sec!"
    timeout: "<red>[Game] Nobody guessed. The word was: <white><answer>"
  quiz:
    start: "<gold>[Quiz] <yellow><prompt>"
    win: "<green>[Quiz] <yellow><player> <green>answered: <white><answer> <green>(<time> sec)"
    timeout: "<red>[Quiz] Nobody answered. Correct answer: <white><answer>"
  math:
    start: "<gold>[Math] <yellow>Solve: <white><prompt>"
    win: "<green>[Math] <yellow><player> <green>answered: <white><answer> <green>(<time> sec)"
    timeout: "<red>[Math] Nobody solved. Answer: <white><answer>"