# ============================================================
#  CHAT — сообщения
# ============================================================

chat:
  # ===== Общее =====
  prefix: "<gray>[<gold>TerraCraftChat<gray>] <reset>"
  no-permission: "<red>У вас нет прав на это действие."
  config-reloaded: "<green>Конфигурация перезагружена."
  config-reload-failed: "<red>Не удалось перезагрузить конфиг. Проверьте консоль."

  # ===== Каналы =====
  channel-no-access: "<red>У вас нет доступа к этому каналу."
  channel-unknown: "<red>Канал '<id>' не найден."
  channel-switched: "<gray>Активный канал: <yellow><channel></yellow>"
  channel-reset: "<gray>Канал сброшен на стандартный."

  # ===== Ники =====
  nick-empty: "<red>Ник не может быть пустым."
  nick-too-long: "<red>Ник слишком длинный (макс. 16)."
  nick-set: "<green>Ник установлен."
  nick-reset: "<yellow>Ник сброшен."
  nick-invalid: "<red>Ник содержит запрещённые теги."
  nick-impersonation: "<red>Ник совпадает с игроком <white><player></white>."
  nick-reserved: "<red>Ник '<player>' зарезервирован."

  # ===== Игнор =====
  ignore-enabled: "<gray>Вы больше не видите сообщения игрока <white><player><gray>."
  ignore-disabled: "<gray>Вы снова видите сообщения игрока <white><player><gray>."
  cannot-ignore-self: "<red>Нельзя игнорировать самого себя."
  ignore-list-empty: "<gray>Ваш игнор-лист пуст."
  ignore-list-header: "<gray>Игнорируемые (<count>):"
  ignore-list-entry: "<dark_gray> • <white><player>"
  ignore-invalid-time: "<red>Неверный формат времени. Пример: 30m, 2h, 1d, 1w"
  ignore-enabled-temp: "<green>Игнорируешь <white><player></white> на <yellow><time></yellow> мин."

  # ===== /msg, /reply =====
  player-not-found: "<red>Игрок <white><player> <red>не найден."
  cannot-message-self: "<red>Нельзя отправить сообщение самому себе."
  target-ignoring-you: "<red>Этот игрок игнорирует ваши сообщения."
  you-ignoring-target: "<red>Вы игнорируете этого игрока. Используйте /ignore <player>, чтобы перестать."
  no-reply-target: "<red>У вас нет собеседника для ответа."

  # ===== Соц-шпион =====
  socialspy-enabled: "<green>Режим соц-шпиона включён. Вы видите все ЛС."
  socialspy-disabled: "<red>Режим соц-шпиона выключен."

  # ===== Модерация =====
  cooldown: "<red>Подожди <white><seconds> <red>сек. перед следующим сообщением."
  duplicate: "<red>Не спамь одинаковыми сообщениями!"
  similar: "<red>Не спамь похожими сообщениями!"
  flood: "<red>Слишком много повторяющихся символов!"
  crash: "<red>Сообщение содержит недопустимые символы."
  swear: "<red>Пожалуйста, не используй нецензурную лексику."
  anti-ad: "<red>Реклама запрещена!"

  # ===== Треды =====
  thread-active: "<green>Режим ответа включён. Следующее сообщение уйдёт в тред."
  thread-limit: "<red>Достигнут лимит ответов в треде."
  thread-no-access: "<red>Вы не видели это сообщение и не можете ответить в тред."
  thread-disabled: "<red>Треды отключены."
  thread-self-reply: "<red>Нельзя ответить в тред на своё же сообщение."
  thread-button-hover: "<gray>Ответить в тред"
  thread-more: "<dark_gray>... ещё <count> ответов"
  thread-replied: "<dark_gray>ответил <target>"

  # ===== Удаление сообщений =====
  delete-button-hover: "<red>Удалить это сообщение"
  delete-notice: "<red>--- Сообщение от <sender> удалено модератором <moderator> ---"
  delete-disabled: "<red>Удаление сообщений отключено."
  invalid-id: "<red>Некорректный идентификатор сообщения."
  message-not-found: "<red>Сообщение не найдено или устарело."

  # ===== [inv] и [item] =====
  inv-self-not-allowed: "<red>Нельзя смотреть свой инвентарь через [inv]."
  inv-token-invalid: "<red>Ссылка на инвентарь устарела или недействительна."
  item-hand-empty: "<gray>пусто"
  inv-label: "<aqua>[Инвентарь]</aqua>"
  inv-hover: "<gray>Нажми, чтобы посмотреть инвентарь <white><player></white>"

  # ===== История =====
  history-empty: "<gray>У игрока <white><player></white> нет сообщений в истории."
  history-header: "<gray>── История <white><player></white> — стр. <yellow><page></yellow>/<yellow><pages></yellow> (всего <yellow><count></yellow>) ──"
  history-entry: "<dark_gray>[<gray><date> <white><time><dark_gray>] <gray>[<yellow><channel><gray>] <white><message>"
  history-footer: "<gray>Следующая страница: <yellow>/chat history <player> <page></yellow>"

  # ===== Статистика =====
  stats-header: "<gray>── Статистика <white><player></white> ──"
  stats-sent: "<gray>Отправлено: <green><count>"
  stats-blocked: "<gray>Заблокировано: <red><count>"
  stats-swear: "<gray>Мат поймано: <yellow><count>"
  stats-ads: "<gray>Реклама поймана: <gold><count>"

  # ===== Purge =====
  purge-started: "<gray>Запущена очистка сообщений старше <yellow><days></yellow> дней (async)."

  # ===== Reload =====
  rules-reloaded: "<green>Правила модерации перезагружены."
  games-reloaded: "<green>Игры перезагружены."
  emojis-reloaded: "<green>Эмодзи перезагружены."
  lang-reloaded: "<green>Локализации перезагружены."

  # ===== Chat Games toggle =====
  chatgames-status: "<gray>Игры: <yellow><state></yellow>, активная: <yellow><active></yellow>"
  chatgames-state-on: "<green>вкл</green>"
  chatgames-state-off: "<red>выкл</red>"
  chatgames-state-yes: "<green>да</green>"
  chatgames-state-no: "<gray>нет</gray>"
  chatgames-on: "<green>Игры включены."
  chatgames-off: "<red>Игры выключены."
  chatgames-already-on: "<gray>Игры уже включены."
  chatgames-already-off: "<gray>Игры уже выключены."

  # ===== Группы =====
  group-invalid-name: "<red>Имя группы: 3-16 символов, a-z, 0-9, _"
  group-name-taken: "<red>Группа <white><name></white> уже существует."
  group-create-failed: "<red>Не удалось создать группу."
  group-created: "<green>Группа <white><name></white> создана. Ты в ней."
  group-not-found: "<red>Группа не найдена."
  group-not-owner: "<red>Только владелец может это делать."
  group-not-member: "<red>Ты не участник этой группы."
  group-member-added: "<green>Игрок добавлен в <white><group></white>."
  group-left: "<gray>Ты вышел из <white><group></white>."
  group-deleted: "<red>Группа <white><group></white> удалена."
  group-active: "<gray>Активная группа: <white><name></white>. Пиши в неё через /chat group <name> <msg>"

  # ===== Discord =====
  discord-format: "**[Объявление]** <sender>: <message>"

# ============================================================
#  AUTOBROADCAST
# ============================================================

autobroadcast:
  rules: "<yellow>Не забывай читать правила: <white>/rules"
  discord: "<yellow>Наш Discord: <white>discord.gg/terracraft"
  donate: "<yellow>Купить донат: <white>/donate"

# ============================================================
#  CHAT GAMES
# ============================================================

chatgames:
  unscramble:
    start: "<gold>[Игра] <yellow>Разгадай слово: <white><prompt>"
    win: "<green>[Игра] <yellow><player> <green>угадал слово <white><answer> <green>за <time> сек!"
    timeout: "<red>[Игра] Никто не угадал. Слово было: <white><answer>"
  quiz:
    start: "<gold>[Викторина] <yellow><prompt>"
    win: "<green>[Викторина] <yellow><player> <green>ответил: <white><answer> <green>(<time> сек)"
    timeout: "<red>[Викторина] Никто не ответил. Правильный ответ: <white><answer>"
  math:
    start: "<gold>[Математика] <yellow>Реши: <white><prompt>"
    win: "<green>[Математика] <yellow><player> <green>ответил: <white><answer> <green>(<time> сек)"
    timeout: "<red>[Математика] Никто не решил. Ответ: <white><answer>"