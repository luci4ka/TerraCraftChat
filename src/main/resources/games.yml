      - question: "Из чего делается факел?"
        answers: ["палка и уголь", "уголь и палка", "палка уголь", "уголь палка"]
      - question: "Какой моб телепортируется?"
        answers: ["эндермен", "enderman"]
      - question: "Сколько блоков обсидиана нужно для портала в Нижний мир (минимум)?"
