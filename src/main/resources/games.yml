# ============================================================
#  CHAT GAMES — контент
# ============================================================
#
# Каждая игра — отдельная секция с уникальным ID.
# type: unscramble | quiz | math
#
# Общие поля:
#   type     — тип игры
#   weight   — вес при случайном выборе (чем больше, тем чаще)
#   timeout  — время на ответ (сек), 0 = глобальный из config.yml
#   rewards  — команды от консоли при победе (placeholder {player})
#
# Тип unscramble:
#   words: список слов для перемешивания (без пробелов!)
#
# Тип quiz:
#   questions: список вопросов с ответами
#     - question: "Текст вопроса"
#       answers: ["ответ1", "ответ2"]  # любой из них засчитывается
#       caseSensitive: false            # учитывать регистр
#
# Тип math:
#   operations: [add, sub, mul, div]
#   minNumber: 1
#   maxNumber: 100

games:

  # ============================================================
  #  UNSCRAMBLE
  # ============================================================

  unscramble_easy:
    type: "unscramble"
    weight: 5
    timeout: 30
    words:
      - "алмаз"
      - "золото"
      - "изумруд"
      - "камень"
      - "дерево"
      - "песок"
      - "земля"
      - "вода"
      - "лава"
      - "огонь"
    rewards:
      - "give {player} diamond 1"

  unscramble_medium:
    type: "unscramble"
    weight: 4
    timeout: 30
