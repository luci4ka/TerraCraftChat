plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.3.2'
}

group = 'ru.terracraft'
version = '1.2.0'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://raw.githubusercontent.com/CarmJos/MineSQL/repo/' }
    maven { url = 'https://repo.carm.cc/repository/maven-public/' }
    maven { url = 'https://repo.codemc.org/repository/maven-public/' }
}

// ============================================================
//  ВЕРСИИ — фиксируем, чтобы сборки были воспроизводимыми
// ============================================================

ext {
    paperApiVersion = '26.3.build.253-stable'
    // MockBukkit собирается под конкретную версию игры: берём ту, для которой
    // есть релиз, и жёстко фиксируем её только для тестового classpath.
    mockBukkitVersion = '4.117.0'
    mockBukkitPaperApiVersion = '26.2.build.1267-stable'
    commandApiVersion = '12.1.0'
    skinsRestorerVersion = '15.12.6'
    placeholderApiVersion = '2.12.3'
    mineSqlVersion = '1.4.2'
    easySqlVersion = '0.4.7'
    configLibVersion = '4.8.1'
    bstatsVersion = '3.2.1'
    junitVersion = '6.1.3'
}

dependencies {
    // ==================== PAPER ====================
    compileOnly "io.papermc.paper:paper-api:${paperApiVersion}"

    compileOnly "net.skinsrestorer:skinsrestorer-api:${skinsRestorerVersion}"
    compileOnly "cc.carm.plugin:minesql-api:${mineSqlVersion}"
    compileOnly "dev.jorel:commandapi-paper-core:${commandApiVersion}"
    compileOnly "cc.carm.lib:easysql-api:${easySqlVersion}"
    compileOnly "me.clip:placeholderapi:${placeholderApiVersion}"

    implementation "org.bstats:bstats-bukkit:${bstatsVersion}"
    implementation "de.exlll:configlib-yaml:${configLibVersion}"
    implementation 'com.github.ez-plugins:mc-plugin-update-notifier:1.0.0'

    // ==================== TESTS ====================
    testImplementation "io.papermc.paper:paper-api:${mockBukkitPaperApiVersion}"
    testImplementation "net.skinsrestorer:skinsrestorer-api:${skinsRestorerVersion}"
    testImplementation "de.exlll:configlib-yaml:${configLibVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testImplementation "org.mockbukkit.mockbukkit:mockbukkit-v26.2:${mockBukkitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Тестовый classpath должен использовать ту же версию Paper API, что и MockBukkit,
// иначе MockBukkit падает на несовпадении данных реестров.
configurations.matching { it.name.toLowerCase().contains('test') }.configureEach {
    resolutionStrategy.force "io.papermc.paper:paper-api:${mockBukkitPaperApiVersion}"
}

def targetJavaVersion = 25

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJavaVersion)
    options.compilerArgs += ['-Xlint:all', '-Xlint:-serial', '-Xlint:-processing']
}

// ============================================================
//  TESTS (JUnit 5 / Jupiter 6, Java 25)
// ============================================================

tasks.named('test') {
    useJUnitPlatform()

    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
        showStandardStreams = false
    }

    // Locale-тесты читают src/main/resources — держим предсказуемый workdir
    workingDir = projectDir
    systemProperty 'file.encoding', 'UTF-8'

    maxParallelForks = 1
    jvmArgs += ['-XX:+EnableDynamicAgentLoading', '-Xshare:off']
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}

// ============================================================
//  SHADOW JAR
// ============================================================

shadowJar {
    archiveClassifier.set('')

    relocate 'org.bstats', 'ru.net.terracraft.chat.libs.bstats'
    relocate 'de.exlll.configlib', 'ru.net.terracraft.chat.libs.configlib'
    relocate 'com.github.ezplugins', 'ru.net.terracraft.chat.libs.updater'

    exclude 'META-INF/maven/**'
    exclude 'META-INF/LICENSE*'
    exclude 'META-INF/NOTICE*'
    exclude 'module-info.class'
    exclude 'META-INF/versions/**/module-info.class'

    mergeServiceFiles()
}

tasks.named('jar') {
    enabled = false
}

build.dependsOn shadowJar
