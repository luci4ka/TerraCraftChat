plugins {
    id 'java'
    id("io.papermc.paperweight.userdev") version "2.0.0-beta.19"
    id 'com.gradleup.shadow' version '9.3.2'
}

group = 'net.ru.terracraft'
version = '1.0'

repositories {
    mavenCentral()

    maven { url 'https://repo.papermc.io/repository/maven-public/' }
    maven { url 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven {
        name = "jitpack"
        url = "https://jitpack.io/"
    }
    maven { url 'https://repo.codemc.org/repository/maven-public/' }
}

dependencies {
    paperweight.paperDevBundle("1.21.11-R0.1-SNAPSHOT")

    implementation("org.bstats:bstats-bukkit:3.2.1")
    implementation("de.exlll:configlib-yaml:4.8.1")

    compileOnly 'net.skinsrestorer:skinsrestorer-api:15.12.6'
    compileOnly("dev.jorel:commandapi-paper-core:12.1.0")
    compileOnly 'me.clip:placeholderapi:2.12.3'
    implementation('com.github.ez-plugins:mc-plugin-update-notifier:1.0.0')
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}

// ============================================================
//  SHADOW JAR
// ============================================================

shadowJar {
    archiveClassifier.set('')

    relocate 'org.bstats', 'ru.net.terracraft.chat.libs.bstats'
    relocate 'de.exlll.configlib', 'ru.net.terracraft.chat.libs.configlib'
    relocate 'com.github.ezplugins', 'ru.net.terracraft.chat.libs.updater'

    // Убираем лишнее из JAR
    exclude 'META-INF/maven/**'
    exclude 'META-INF/LICENSE*'
    exclude 'META-INF/NOTICE*'
    exclude 'module-info.class'

    mergeServiceFiles()
}

// ============================================================
//  ОТКЛЮЧАЕМ ОБЫЧНЫЙ JAR
// ============================================================

tasks.named('jar') {
    enabled = false
}

// Сборка build → сначала shadowJar
build.dependsOn shadowJar